[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-web-app"
version = "0.1.0"
description = "Jarvis Web application"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18,<2.0",
    "ddgs==9.15.0",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<1.0",
    "mcp>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
jarvis-exec-mcp = "jarvis.exec.server:main"
jarvis-exec-proxy = "jarvis.exec_proxy.main:main"
jarvis-web-access = "jarvis.web_access.__main__:main"
jarvis-web-access-proxy = "jarvis.web_proxy.main:main"

[tool.setuptools.packages.find]
where = ["../../../../src"]
include = ["jarvis", "jarvis.*"]
