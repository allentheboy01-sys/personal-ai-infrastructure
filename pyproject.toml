[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "pdi"
version = "0.5.0"
description = "Personal Digital Infrastructure"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.18,<2.0",
    "defusedxml>=0.7,<1.0",
    "google-auth>=2.56,<3.0",
    "httpx>=0.28,<1.0",
    "mcp>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "pypdf>=6.14,<7.0",
    "python-dotenv>=1.1,<2.0",
    "requests>=2.32,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "starlette>=0.47,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
pdi = "pdi.cli:main"

[project.optional-dependencies]
jarvis-web = [
    "fastapi>=0.141,<0.142",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
