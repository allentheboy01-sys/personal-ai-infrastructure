[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "pdi"
version = "0.6.0"
description = "Personal Digital Infrastructure"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "personal-data",
    "self-hosted",
    "mcp",
    "data-infrastructure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]

dependencies = [
    "alembic>=1.18,<2.0",
    "defusedxml>=0.7,<1.0",
    "google-auth>=2.56,<3.0",
    "httpx>=0.28,<1.0",
    "mcp>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "pypdf>=6.14,<7.0",
    "python-dotenv>=1.1,<2.0",
    "requests>=2.32,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "starlette>=0.47,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.scripts]
pdi = "pdi.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
]

[project.urls]
Homepage = "https://github.com/allentheboy01-sys/personal-ai-infrastructure"
Documentation = "https://github.com/allentheboy01-sys/personal-ai-infrastructure/tree/main/docs"
Repository = "https://github.com/allentheboy01-sys/personal-ai-infrastructure"
Issues = "https://github.com/allentheboy01-sys/personal-ai-infrastructure/issues"


[tool.setuptools.packages.find]
where = ["src"]
include = [
    "pdi",
    "pdi.*",
    "pdi_mcp",
    "pdi_mcp.*",
    "pdi_resource_access",
    "pdi_resource_access.*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
